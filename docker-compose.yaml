version: '3.9'

services:
  db:
    image: postgis/postgis:15-3.4
    env_file:
      - ./fix  # <--- Points to your 'fix' file
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mhews"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - ./fix  # <--- Points to your 'fix' file
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

volumes:
  db_data: